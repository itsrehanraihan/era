[package]
name = "era_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "era"
path = "src/main.rs"

[dependencies]
era_diagnostics = { path = "../era_diagnostics" }
era_project = { path = "../era_project" }
era_syntax = { path = "../era_syntax" }
era_ir = { path = "../era_ir" }
era_codegen_compose = { path = "../era_codegen_compose" }
# Resize the app icon into Android launcher icons (D-085). Already in the
# workspace for ERA Studio; JPEG and WebP decoders added for icon sources.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[dev-dependencies]
# Temporary folders for CLI integration tests.
tempfile = "3.27"
